<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="900" height="200">

  <defs>

    <!-- ── Google Fonts + CSS animations ───────────────────────────────── -->
    <style type="text/css"><![CDATA[
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;700&family=JetBrains+Mono:wght@300;400&display=swap');

      @keyframes fadeSlideUp {
        from { opacity: 0; transform: translateY(10px); }
        to   { opacity: 1; transform: translateY(0px);  }
      }
      @keyframes fadeIn {
        from { opacity: 0; }
        to   { opacity: 1; }
      }

      .t-name {
        font-family: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
        animation: fadeSlideUp 0.9s cubic-bezier(0.4,0,0.2,1) 0.30s both;
      }
      .t-sub1 {
        font-family: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
        animation: fadeSlideUp 0.9s cubic-bezier(0.4,0,0.2,1) 0.50s both;
      }
      .t-sub2 {
        font-family: 'JetBrains Mono', 'Courier New', Courier, monospace;
        animation: fadeSlideUp 0.9s cubic-bezier(0.4,0,0.2,1) 0.70s both;
      }
      .v-bar { animation: fadeIn 0.5s ease-out 0.05s both; }
    ]]></style>

    <!-- ── Subtle grain / noise texture ────────────────────────────────── -->
    <filter id="grain" x="0" y="0" width="100%" height="100%"
            color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3"
                    seed="4" stitchTiles="stitch" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="grayNoise"/>
      <feBlend in="SourceGraphic" in2="grayNoise" mode="soft-light" result="blended"/>
      <feComposite in="blended" in2="SourceGraphic" operator="in"/>
    </filter>

    <!-- ── Very subtle red ambient glow on the left ─────────────────────── -->
    <radialGradient id="barGlow" cx="0" cy="0.5" r="0.38"
                    fx="0" fy="0.5" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#2a0000" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

  </defs>

  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <!-- BACKGROUND                                                          -->
  <!-- ═══════════════════════════════════════════════════════════════════ -->

  <rect width="900" height="200" fill="#000000"/>

  <!-- Grain texture overlay (very subtle depth) -->
  <rect width="900" height="200" fill="#1c1c1c" opacity="0.22" filter="url(#grain)"/>

  <!-- Left red ambient glow -->
  <rect width="900" height="200" fill="url(#barGlow)"/>


  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <!-- ANIMATED BORDER LINES  (SMIL — renders on GitHub + in browsers)    -->
  <!-- ═══════════════════════════════════════════════════════════════════ -->

  <!-- Top red hairline — expands left → right -->
  <rect x="0" y="0" width="0" height="1.5" fill="#CC0000">
    <animate attributeName="width" from="0" to="900"
             dur="0.85s" begin="0s" fill="freeze"
             calcMode="spline" keyTimes="0;1" keySplines="0.4 0 0.2 1"/>
  </rect>

  <!-- Bottom red hairline — expands left → right, slight delay -->
  <rect x="0" y="198.5" width="0" height="1.5" fill="#CC0000">
    <animate attributeName="width" from="0" to="900"
             dur="0.85s" begin="0.2s" fill="freeze"
             calcMode="spline" keyTimes="0;1" keySplines="0.4 0 0.2 1"/>
  </rect>


  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <!-- LEFT VERTICAL ACCENT BAR                                            -->
  <!-- ═══════════════════════════════════════════════════════════════════ -->

  <rect class="v-bar" x="40" y="20" width="2" height="160" fill="#CC0000"/>


  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <!-- INNER HAIRLINES  (very dark gray, frame the text area)             -->
  <!-- ═══════════════════════════════════════════════════════════════════ -->

  <rect x="42" y="32"  width="818" height="0.5" fill="#1a1a1a"/>
  <rect x="42" y="166" width="818" height="0.5" fill="#1a1a1a"/>



  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <!-- TYPOGRAPHY                                                          -->
  <!-- ═══════════════════════════════════════════════════════════════════ -->

  <!--
    Main name: JUHUN (bold, #f0f0f0)  ·  KANG (light, slightly dimmer)
    Baseline at y=96; caps ~39 px tall → top edge ≈ y=57 (clear of hairline at 32)
  -->
  <text class="t-name"
        x="68" y="96"
        font-size="56" letter-spacing="6"
        fill="#f0f0f0"
  ><tspan font-weight="700">JUHUN</tspan><tspan font-weight="300" fill="#b8b8b8"> KANG</tspan></text>

  <!--
    Subtitle 1: alias · Korean name
    Baseline at y=118 (22 px below name baseline)
  -->
  <text class="t-sub1"
        x="70" y="120"
        font-size="13.5" letter-spacing="2.5" font-weight="300"
        fill="#5e5e5e">Jackie · 강주헌</text>

  <!--
    Subtitle 2: role — monospace, uppercase, letter-spaced, muted
    Baseline at y=142 (22 px below sub1 baseline)
  -->
  <text class="t-sub2"
        x="70" y="143"
        font-size="9.5" letter-spacing="3.8" font-weight="400"
        fill="#7a7a7a">AUTOMOTIVE EMBEDDED SOFTWARE ENGINEER</text>

</svg>
